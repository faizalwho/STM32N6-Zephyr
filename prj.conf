CONFIG_LOG=y
CONFIG_GPIO=y

# Display + LVGL
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=y

# LVGL memory: keep the render buffer small (partial rendering),
# the board only has ~511 KiB of internal RAM
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y

# Fonts
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y

# Main thread needs room for LVGL
CONFIG_MAIN_STACK_SIZE=8192
